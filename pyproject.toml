[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "law-openapi-mcp"
version = "0.1.0"
description = "MCP server + CLI for Korea's national law information OpenAPI (법제처 국가법령정보)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yeondong Yang" }]
keywords = ["mcp", "korea", "law", "legislation", "statute", "case-law",
            "moleg", "openapi", "bibliography", "citation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=1.2.0,<2",  # 🔴 상한 필수 — mcp 2.0 에서 `mcp.server.fastmcp` 가 제거됐다.
                      # 상한이 없으면 uvx/uv 경로가 매번 2.x 를 새로 해석해 기동이 죽는다
                      # (uv.lock 은 클라이언트 경로에 적용되지 않으므로 방어선은 여기뿐).
                      # 자매 저장소 kci·scienceon·nl 이 각각 이 상한 누락으로 기동 불능을 겪었다.
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.9",  # 교육망/사내망 SSL 인터셉션 대응(OS 신뢰저장소 사용, 검증은 유지)
]

[project.scripts]
law-openapi-mcp = "law_mcp.server:main"   # 패키지명과 동일 — `uvx law-openapi-mcp`
law-mcp = "law_mcp.server:main"           # 짧은 별칭 (MCP 등록에 사용)
law = "law_mcp.cli:main"                  # CLI

[project.urls]
Homepage = "https://github.com/rubatoyd/law-openapi-mcp"
Repository = "https://github.com/rubatoyd/law-openapi-mcp"
Issues = "https://github.com/rubatoyd/law-openapi-mcp/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/law_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
